server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: anjoryx-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/anjoryx_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:anjoryx.tech@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@ajoryx.com}
    to: ${CONTACT_EMAIL:anjoryx.tech@gmail.com}

  rate-limit:
    contact:
      max-requests: ${CONTACT_RATE_LIMIT_MAX:5}
      window-minutes: ${CONTACT_RATE_LIMIT_WINDOW_MINUTES:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.anjoryx: ${LOG_LEVEL:INFO}
