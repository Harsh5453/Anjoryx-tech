    <!-- Apply the saved theme before first paint so there is no light/dark flash. Light is the default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('anjoryx-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.add('light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
